# Values for the unified portal app. Unlike a regular tool, the portal
# needs `serviceAccount.create: true` (so other tools' `dashboardGrant` has
# something to point at for reading Deployment readiness) and a
# `TOOLS_REGISTRY_JSON` env var listing every deployed tool -- see
# docs/adding-a-tool.md: adding a tool means adding an entry here (and a
# ToolPanel variant in apps/portal/frontend).

nameOverride: "portal"
fullnameOverride: ""

image:
  repository: harbor.k8s.lysakermoen.com/tools/portal-backend
  tag: "latest"
  pullPolicy: IfNotPresent

# See deploy/hello/values.yaml's comment -- same requirement, own namespace
# (tools-portal).
imagePullSecrets:
  - name: harbor-pull

replicaCount: 1
containerPort: 8080

envFrom: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi

env:
  - name: TOOLS_REGISTRY_JSON
    value: |
      [
        {
          "id": "hello",
          "name": "Hello",
          "description": "Reference example tool (Postgres + S3 + websocket).",
          "standalone_url": "https://hello.k8s.lysakermoen.com",
          "api_base_url": "https://hello.k8s.lysakermoen.com",
          "health_path": "/health",
          "k8s_namespace": "tools-hello",
          "k8s_deployment": "tools-hello"
        }
      ]

# Grants other tools' `dashboardGrant` something to bind to -- this
# ServiceAccount itself carries no RBAC; each tool grants it read access to
# its own namespace individually (least privilege, see
# deploy/hello/values.yaml's dashboardGrant).
serviceAccount:
  create: true

dashboardGrant:
  enabled: false

ingress:
  enabled: true
  className: internal
  host: portal.k8s.lysakermoen.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
  tls:
    enabled: true
    secretName: portal-internal-tls

bucket:
  enabled: false

postgres:
  enabled: false

monitoring:
  enabled: true
  interval: 30s
  serviceMonitorLabels: {}
  prometheusRuleLabels: {}
  dashboardNamespace: "monitoring"
  alerts:
    enabled: true
