# Values for the unified portal app. Unlike a regular tool, the portal
# needs `serviceAccount.create: true` (so other tools' `dashboardGrant` has
# something to point at for reading Deployment readiness) and a
# `TOOLS_REGISTRY_JSON` env var listing every deployed tool -- see
# docs/adding-a-tool.md: adding a tool means adding an entry here (and a
# ToolPanel variant in apps/portal/frontend).

nameOverride: "portal"
fullnameOverride: ""
image:
  repository: harbor.k8s.lysakermoen.com/tools/portal-backend
  tag: "a6e1c7c2df9481517b5d79057c111396bea25eff"
  pullPolicy: IfNotPresent
# See deploy/hello/values.yaml's comment -- not needed unless `tools`
# ends up a private Harbor project.
imagePullSecrets: []
replicaCount: 1
containerPort: 8080
envFrom: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi
env:
  # This app's own sign-in state (client_id "portal", see
  # deploy/idp/values.yaml's IDP_CLIENTS_JSON) -- gates portal-native
  # features only, not other tools' panels. See
  # crates/adapters/auth's docs and apps/portal/frontend/src/lib.rs.
  - name: IDP_ISSUER_URL
    value: "https://idp.k8s.lysakermoen.com"
  - name: AUTH_CLIENT_ID
    value: "portal"
  - name: TOOLS_REGISTRY_JSON
    value: |
      [
        {
          "id": "hello",
          "name": "Hello",
          "description": "Reference example tool (Postgres + S3 + websocket, egui panel + standalone).",
          "standalone_url": "https://hello.k8s.lysakermoen.com",
          "api_base_url": "https://hello.k8s.lysakermoen.com",
          "health_path": "/health",
          "k8s_namespace": "tools-hello",
          "k8s_deployment": "tools-hello",
          "requires_role": null
        },
        {
          "id": "webhello",
          "name": "Webhello",
          "description": "Reference tool with a plain static HTML/JS frontend instead of egui -- link-out only, no portal panel. Shares hello's own Postgres/S3 (same namespace, same data) -- see deploy/webhello/values.yaml.",
          "standalone_url": "https://webhello.k8s.lysakermoen.com",
          "api_base_url": "https://webhello.k8s.lysakermoen.com",
          "health_path": "/health",
          "k8s_namespace": "tools-hello",
          "k8s_deployment": "tools-webhello",
          "requires_role": null
        },
        {
          "id": "game-mgr",
          "name": "game-mgr",
          "description": "Ported from the standalone game-mgr repo: install/playtime/sync stats for a personal game library, egui panel + standalone.",
          "standalone_url": "https://games.lysakermoen.com",
          "api_base_url": "https://games.lysakermoen.com",
          "health_path": "/healthz",
          "k8s_namespace": "tools-game-mgr",
          "k8s_deployment": "tools-game-mgr",
          "requires_role": null
        }
      ]
# Grants other tools' `dashboardGrant` something to bind to -- this
# ServiceAccount itself carries no RBAC; each tool grants it read access to
# its own namespace individually (least privilege, see
# deploy/hello/values.yaml's dashboardGrant).
serviceAccount:
  create: true
dashboardGrant:
  enabled: false
ingress:
  enabled: true
  className: internal
  host: portal.k8s.lysakermoen.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
  tls:
    enabled: true
    secretName: portal-internal-tls
bucket:
  enabled: false
postgres:
  enabled: false
monitoring:
  enabled: true
  interval: 30s
  serviceMonitorLabels: {}
  prometheusRuleLabels: {}
  dashboardNamespace: "monitoring"
  alerts:
    enabled: true
