# Reference values for the `hello` example tool. Copy this file's shape
# for a new tool -- see docs/adding-a-tool.md.

nameOverride: "hello"
fullnameOverride: ""

image:
  # Placeholder -- point at your real registry (Harbor) before deploying.
  repository: harbor.example.internal/tools/hello-backend
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8081

env: []
envFrom: []
resources: {}

dashboardRbac:
  enabled: false

ingress:
  enabled: true
  # Left blank so the cluster's default IngressClass is used -- set this
  # explicitly if you have more than one. See docs/architecture.md for the
  # "adjust to your ingress controller" checklist (this is an example only).
  className: ""
  host: hello.tools.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ""

bucket:
  enabled: true
  # rook-ceph appends a random suffix to this prefix (generateBucketName).
  bucketName: hello
  # Must match the name of your rook-ceph bucket StorageClass.
  storageClassName: rook-ceph-bucket

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: ""
  database: hello

monitoring:
  enabled: true
  interval: 30s
  # Set these to match your Prometheus Operator's serviceMonitorSelector /
  # ruleSelector if it doesn't pick these up by default.
  serviceMonitorLabels: {}
  prometheusRuleLabels: {}
  grafanaInstanceSelector:
    matchLabels:
      dashboards: grafana
  alerts:
    enabled: true
