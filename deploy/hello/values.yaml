# Values for the `hello` example tool. Copy this file's shape for a new
# tool -- see docs/adding-a-tool.md.

nameOverride: "hello"
fullnameOverride: ""
image:
  repository: harbor.k8s.lysakermoen.com/tools/hello-backend
  tag: "e2f91ce655cfbf72a7863db589c87288169fb82d"
  pullPolicy: IfNotPresent
# Not needed as long as the `tools` Harbor project allows anonymous pull,
# same as `library` does today (trilium-mcp pulls from it with no
# imagePullSecrets and works). Only add one if `tools` ends up private:
#   imagePullSecrets:
#     - name: harbor-pull   # kubectl create secret docker-registry harbor-pull ...
imagePullSecrets: []
replicaCount: 1
containerPort: 8081
env:
  # This app's own sign-in state -- see deploy/idp/values.yaml's
  # IDP_CLIENTS_JSON "hello" entry (declares the "operator" role gating
  # the reset-greetings example action) and crates/adapters/auth's docs.
  - name: IDP_ISSUER_URL
    value: "https://idp.k8s.lysakermoen.com"
  - name: AUTH_CLIENT_ID
    value: "hello"
envFrom: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi
serviceAccount:
  create: false
# Lets the portal's dashboard read this Deployment's readiness -- a
# namespace-scoped Role/RoleBinding in tools-hello only, granted to the
# portal's ServiceAccount (see deploy/portal/values.yaml).
dashboardGrant:
  enabled: true
  subjectName: tools-portal
  subjectNamespace: tools-portal
ingress:
  enabled: true
  className: internal
  host: hello.k8s.lysakermoen.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
  tls:
    enabled: true
    secretName: hello-internal-tls
bucket:
  enabled: true
  bucketName: tools-hello
  # Must match the name of your rook-ceph bucket StorageClass.
  storageClassName: rook-ceph-bucket
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: rook-ceph-block-ssd
  database: hello
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
monitoring:
  enabled: true
  interval: 30s
  # This cluster's Prometheus Operator watches ServiceMonitors/PrometheusRules
  # cluster-wide with an empty selector, so no specific label is required --
  # left here in case that ever changes.
  serviceMonitorLabels: {}
  prometheusRuleLabels: {}
  dashboardNamespace: "monitoring"
  alerts:
    enabled: true
