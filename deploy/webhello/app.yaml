# ArgoCD Application for deploy/webhello -- see deploy/hello/app.yaml for
# why this lives outside the chart and how it gets picked up (auto-discovered
# via the kubernetes repo's cluster/prod/apps/tools/app.yaml "tools root"
# Application, not applied by hand).
#
# Deployed into hello's own namespace (tools-hello), not a separate one:
# webhello shares hello's existing Postgres/S3 (see values.yaml's `envFrom`)
# rather than provisioning its own -- it's still its own Deployment/process
# (a second, independently-deployable frontend against the same app's
# data), the same "tightly-coupled apps share a namespace" pattern the
# `media` app (qbittorrent + the arr stack + jellyfin sharing one bucket)
# already uses, per CLAUDE.md's namespace guidance.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools-webhello
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/Sanlys/tools.git"
    targetRevision: main
    path: deploy/webhello
  destination:
    server: https://kubernetes.default.svc
    namespace: tools-hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
