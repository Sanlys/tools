# Values for the `webhello` example tool -- see apps/webhello/backend's
# module doc for what it's demonstrating (a plain static HTML/JS frontend
# instead of egui/wasm, still its own independently-deployable process --
# but sharing *hello's own* Postgres `greetings` table and S3 bucket, not
# provisioning its own. Both `bucket.enabled`/`postgres.enabled` below stay
# `false` -- the `envFrom` block instead points straight at the Secrets/
# ConfigMap `deploy/hello`'s chart already creates (`tools-hello-postgres`,
# `tools-hello-bucket`), which only works because this Application deploys
# into hello's own namespace (`tools-hello`, see app.yaml) rather than its
# own. This means webhello's pod won't come up before hello's Postgres/
# bucket exist -- acceptable here since the two are meant to be deployed
# together as one family, not truly independent apps (see app.yaml's
# comment); don't copy this cross-release `envFrom` pattern for a tool that
# doesn't have that same relationship with another one.

nameOverride: "webhello"
fullnameOverride: ""
image:
  repository: harbor.k8s.lysakermoen.com/tools/webhello-backend
  tag: "01bf9f0b2e19e08a72bc663133ba247b359f0d1a"
  pullPolicy: IfNotPresent
# Not needed as long as the `tools` Harbor project allows anonymous pull --
# see deploy/hello/values.yaml's comment.
imagePullSecrets: []
replicaCount: 1
containerPort: 8082
env:
  # This app's own sign-in state -- see deploy/idp/values.yaml's
  # IDP_CLIENTS_JSON "webhello" entry and apps/webhello/backend/src/main.rs's
  # doc comment (plain-JS PKCE flow, no auth_adapter frontend crate since
  # this tool has no wasm at all). Kept as its own separate IDP client even
  # though the data below is shared with hello -- this is still its own
  # process with its own audience-scoped tokens.
  - name: IDP_ISSUER_URL
    value: "https://idp.k8s.lysakermoen.com"
  - name: AUTH_CLIENT_ID
    value: "webhello"
envFrom:
  - configMapRef:
      name: tools-hello-bucket
  - secretRef:
      name: tools-hello-bucket
  - secretRef:
      name: tools-hello-postgres
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi
serviceAccount:
  create: false
# Lets the portal's dashboard read this Deployment's readiness -- a
# namespace-scoped Role/RoleBinding (this release's own fullname, so it
# doesn't collide with hello's own dashboardGrant in the same namespace),
# granted to the portal's ServiceAccount (see deploy/portal/values.yaml).
dashboardGrant:
  enabled: true
  subjectName: tools-portal
  subjectNamespace: tools-portal
ingress:
  enabled: true
  className: internal
  host: webhello.k8s.lysakermoen.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
  tls:
    enabled: true
    secretName: webhello-internal-tls
# Not provisioning its own bucket/Postgres -- see the top comment.
bucket:
  enabled: false
postgres:
  enabled: false
monitoring:
  enabled: true
  interval: 30s
  serviceMonitorLabels: {}
  prometheusRuleLabels: {}
  dashboardNamespace: "monitoring"
  alerts:
    enabled: true
