# ArgoCD Application for deploy/game-mgr. Not part of the Helm chart it
# points to (an Application can't sensibly live inside the release it
# manages). Auto-discovered, not applied by hand -- see deploy/hello/app.yaml's
# identical comment and docs/ci-cd.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools-game-mgr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/Sanlys/tools.git"
    targetRevision: main
    path: deploy/game-mgr
  destination:
    server: https://kubernetes.default.svc
    namespace: tools-game-mgr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
