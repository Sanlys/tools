name: release

# Builds + pushes an image per app to the internal registry, then bumps
# that app's `deploy/<app>/values.yaml` image tag and commits it back --
# ArgoCD (GitOps, watching this repo) picks up the change and rolls it out.
# See docs/ci-cd.md.
#
# Requires these repository secrets/variables to actually push anywhere:
#   vars.REGISTRY_HOST      harbor.k8s.lysakermoen.com
#   secrets.REGISTRY_USERNAME
#   secrets.REGISTRY_PASSWORD
# Until those are set, this workflow will fail at the login step -- that's
# expected for a fresh clone of this scaffolding; see docs/ci-cd.md.

on:
  push:
    branches: [main]
    # Desktop client builds (the `desktop` job below) fire on a version tag
    # instead of every push to main -- an end user downloads a specific
    # tagged release, not a moving `latest` the way a container image
    # tracks. Doesn't affect the `release` job below (image build+push+
    # GitOps bump), which only runs on the `main`-push side of this trigger
    # (see its `if:`).
    tags: ["v*"]
  # Also fires when a GitHub Release is published through the web UI with
  # a brand-new tag: creating a tag that way goes through the Releases API
  # rather than a real `git push`, which does NOT emit the `push` event
  # above -- so without this, "Draft a new release" silently never builds
  # anything. `github.ref`/`github.ref_type` are the tag either way, so the
  # `desktop` job's existing `if: github.ref_type == 'tag'` covers both.
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    strategy:
      # Each app's build/deploy is independent -- a transient failure in
      # one app's Docker build (e.g. a flaky release-archive download) has
      # no business cancelling every other app's already-in-flight build
      # before it gets a chance to push+bump its own deploy tag. Without
      # this, `fail-fast`'s default (true) does exactly that: one bad
      # build silently withholds a deploy for every OTHER app in the same
      # push too, with no direct evidence pointing at the actual cause.
      fail-fast: false
      matrix:
        include:
          - name: hello
            dockerfile: apps/hello/backend/Dockerfile
            image: hello-backend
          - name: webhello
            dockerfile: apps/webhello/backend/Dockerfile
            image: webhello-backend
          - name: portal
            dockerfile: apps/portal/backend/Dockerfile
            image: portal-backend
          - name: idp
            dockerfile: apps/idp/backend/Dockerfile
            image: idp-backend
          - name: game-mgr
            dockerfile: apps/game-mgr/backend/Dockerfile
            image: game-mgr-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.REGISTRY_HOST }}/tools/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.REGISTRY_HOST }}/tools/${{ matrix.image }}:latest
          # Same sha the image is tagged with -- only game-mgr's Dockerfile
          # currently declares this ARG (baked into `GET /api/v1/ping`, see
          # its Dockerfile), but an unused build-arg is a harmless no-op
          # for the others rather than something worth a per-app branch
          # here.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: bump deploy/${{ matrix.name }}/values.yaml image tag
        run: yq -i '.image.tag = "${{ github.sha }}"' "deploy/${{ matrix.name }}/values.yaml"

      - name: commit the bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "deploy/${{ matrix.name }}/values.yaml"; then
            echo "no change, skipping commit"
            exit 0
          fi
          git add "deploy/${{ matrix.name }}/values.yaml"
          git commit -m "deploy(${{ matrix.name }}): bump image tag to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  # Desktop binaries this repo ships to end users directly (Linux/Windows),
  # rather than a container image ArgoCD deploys into the cluster.
  # Tag-triggered rather than tied to `main`: a user grabs a specific
  # release, not a moving target.
  #   - game-mgr-client: see apps/game-mgr/client's module docs and
  #     PLAN.md §14 for the Windows support this ships.
  #   - portal-desktop: the unified portal (apps/portal/frontend), run as
  #     a native window instead of in a browser -- see
  #     apps/portal/frontend/src/bin/desktop.rs's module doc comment.
  desktop:
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package: game-mgr-client
            bin: game-mgr-client
            asset: game-mgr-client-linux-x86_64
          - os: windows-latest
            package: game-mgr-client
            bin: game-mgr-client.exe
            asset: game-mgr-client-windows-x86_64.exe
          - os: ubuntu-latest
            package: portal-frontend
            bin: portal-desktop
            asset: portal-desktop-linux-x86_64
          - os: windows-latest
            package: portal-frontend
            bin: portal-desktop.exe
            asset: portal-desktop-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # keyring's Linux backend (used by portal-desktop's native login
      # flow via auth-adapter, see crates/adapters/auth) needs dbus
      # headers to build -- same requirement as ci.yml's rust job. A no-op
      # on windows-latest and harmless for game-mgr-client, which doesn't
      # use it.
      - name: install native build deps (libdbus, for keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: build
        run: cargo build --release -p ${{ matrix.package }}

      - name: rename artifact
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: attach to the GitHub Release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
