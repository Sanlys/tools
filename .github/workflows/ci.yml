name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    # Real services for game-mgr-backend's gated Postgres/S3 integration
    # suites (tests/api_e2e.rs, tests/repo_db.rs -- PLAN.md §15, carried over
    # from game-mgr's own CI; the S3 side moved here from game-mgr-core when
    # bucket access moved server-side, see apps/game-mgr/backend/src/api/
    # artifacts.rs). Harmless to every other crate: nothing else in this
    # workspace reads DATABASE_URL/GM_S3_TEST_* from a test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamemgr
          POSTGRES_PASSWORD: gamemgr
          POSTGRES_DB: gamemgr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamemgr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gamemgr:gamemgr@localhost:5432/gamemgr
      GM_S3_TEST_ENDPOINT: http://localhost:9000
      GM_S3_TEST_ACCESS_KEY: gamemgr
      GM_S3_TEST_SECRET_KEY: gamemgr-secret
      # skipping the gated DB/S3 suites above is an error in CI -- they
      # must actually run, not silently no-op for lack of DATABASE_URL /
      # GM_S3_TEST_ENDPOINT.
      GM_REQUIRE_DB_TESTS: "1"
      GM_REQUIRE_S3_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # keyring's Linux backend (used by auth-adapter's native loopback
      # login flow, see crates/adapters/auth) needs dbus headers to build,
      # only for native targets -- the wasm build below never touches it.
      - name: install native build deps (libdbus, for keyring)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      # MinIO from its first-party registry (S3 stand-in for
      # game-mgr-backend's tests/api_e2e.rs artifact tests; each test
      # creates its own throwaway bucket, see tests/common/mod.rs's
      # TestBucket). Plain `docker run`, not a GitHub service container:
      # those can't pass a command, and MinIO needs `server /data`.
      - name: start MinIO (S3 stand-in for game-mgr-backend's artifact tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gamemgr -e MINIO_ROOT_PASSWORD=gamemgr-secret \
            quay.io/minio/minio server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done'

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: wasm build (portal, which pulls in every tool's frontend crate)
        run: cargo build --target wasm32-unknown-unknown -p portal-frontend --lib

      - name: wasm build (hello's own standalone bundle, separate cdylib from portal's)
        run: cargo build --target wasm32-unknown-unknown -p hello-frontend --lib

      - name: wasm build (game-mgr-frontend's own standalone bundle)
        run: cargo build --target wasm32-unknown-unknown -p game-mgr-frontend --lib

  rust-windows:
    # game-mgr-core/-client are the only crates in this workspace with any
    # Windows-specific code (`game_mgr_core::platform`'s `#[cfg(windows)]`
    # half, `run::NativeLaunch`, the `GogGame` class's native launch path --
    # see PLAN.md §14 and apps/game-mgr's port notes) -- everything else here
    # is a server/wasm workload that never runs on Windows, so only this
    # crate pair needs checking on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check (native, Windows)
        run: cargo check -p game-mgr-core -p game-mgr-client --all-targets

      - name: test (game-mgr-core; no Windows machine has run these for real yet)
        run: cargo test -p game-mgr-core --lib

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: lint every app chart
        run: |
          set -euo pipefail
          for chart in deploy/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            echo "::group::$chart"
            helm dependency build "$chart"
            helm lint "$chart"
            helm template "$chart" > /dev/null
            echo "::endgroup::"
          done

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: hello-backend
            dockerfile: apps/hello/backend/Dockerfile
          - name: webhello-backend
            dockerfile: apps/webhello/backend/Dockerfile
          - name: portal-backend
            dockerfile: apps/portal/backend/Dockerfile
          - name: idp-backend
            dockerfile: apps/idp/backend/Dockerfile
          - name: game-mgr-backend
            dockerfile: apps/game-mgr/backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  local-dev-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate docker-compose.yml (see docs/local-development.md)
        run: docker compose config > /dev/null
