<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{project-name | title_case}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- Same trunk-driven pattern as apps/hello/frontend/index.html --
         see this crate's src/lib.rs's `start()`. -->
    <link data-trunk rel="rust" data-target-name="{{crate_name}}_frontend" />
    <base data-trunk-public-url />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas#the_canvas_id {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
