# Local dev: `trunk serve` from this directory. Run `cargo run -p
# {{project-name}}-backend` alongside it (defaults to 0.0.0.0:{{container_port}});
# the proxies below forward this tool's own API calls to it so the wasm app
# can use relative URLs exactly as it does in production. See
# apps/hello/frontend/Trunk.toml for the reference version of this file.
[build]
target = "index.html"
dist = "dist"

[serve]
port = 1421
open = false

[[proxy]]
backend = "http://127.0.0.1:{{container_port}}/api"

[[proxy]]
backend = "http://127.0.0.1:{{container_port}}/health"
