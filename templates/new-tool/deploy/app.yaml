# ArgoCD Application for this chart. Plain manifest, not part of the Helm
# chart itself -- see deploy/hello/app.yaml for why. Auto-discovered by the
# kubernetes repo's cluster/prod/apps/tools/app.yaml "tools root"
# Application; not applied by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools-{{project-name}}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/Sanlys/tools.git"
    targetRevision: main
    path: deploy/{{project-name}}
  destination:
    server: https://kubernetes.default.svc
    namespace: tools-{{project-name}}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
