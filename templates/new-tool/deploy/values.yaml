nameOverride: "{{project-name}}"
fullnameOverride: ""

image:
  # Placeholder -- point at your real registry (Harbor) before deploying.
  repository: harbor.example.internal/tools/{{project-name}}-backend
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: {{container_port}}

env: []
envFrom: []
resources: {}

dashboardRbac:
  enabled: false

ingress:
  enabled: true
  className: ""
  host: {{project-name}}.tools.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ""

bucket:
  enabled: {{needs_bucket}}
  bucketName: {{project-name}}
  storageClassName: rook-ceph-bucket

postgres:
  enabled: {{needs_postgres}}
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: ""
  database: {{project-name | snake_case}}

monitoring:
  enabled: true
  interval: 30s
  serviceMonitorLabels: {}
  prometheusRuleLabels: {}
  grafanaInstanceSelector:
    matchLabels:
      dashboards: grafana
  alerts:
    enabled: true
