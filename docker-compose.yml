# Local stand-ins for what a real deployment gets from rook-ceph (S3) and
# the chart's single-pod Postgres -- see docs/local-development.md. Not
# used in production; production wiring is entirely in deploy/.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: hello
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devaccesskey
      MINIO_ROOT_PASSWORD: devsecretkey
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 devaccesskey devsecretkey &&
      mc mb --ignore-existing local/hello
      "

volumes:
  postgres-data:
  minio-data:
