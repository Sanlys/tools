[package]
name = "game-mgr-core"
# Rest of `tools` is edition 2021; this crate (and game-mgr-backend/client)
# came from game-mgr's own workspace, which was on edition 2024 and uses
# `let`-chains throughout -- Cargo supports mixed editions per crate in one
# workspace, so this stays 2024 rather than rewriting every call site.
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "game_mgr_core"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
game-mgr-api-types = { workspace = true }
hex = { workspace = true }
hostname = { workspace = true }
open = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
shlex = { workspace = true }
sevenz-rust2 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "io-util"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
