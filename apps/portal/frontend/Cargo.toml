[package]
name = "portal-frontend"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "portal_frontend"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "portal-native"
path = "src/bin/native.rs"

[dependencies]
platform-core.workspace = true
platform-config.workspace = true
api-types.workspace = true
auth-adapter = { workspace = true, features = ["frontend-web", "frontend-native"] }
hello-frontend.workspace = true
tracing.workspace = true

egui.workspace = true
eframe.workspace = true
ehttp.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true }
