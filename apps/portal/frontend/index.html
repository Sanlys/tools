<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tools Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- trunk builds the crate, runs wasm-bindgen, and injects the loader
         script for us. It also triggers apps/portal/frontend/src/lib.rs's
         `#[wasm_bindgen(start)]` function once the module loads, which
         mounts the app into the canvas below.

         data-target-name picks the `[lib]` (cdylib) artifact -- this crate
         also has a `[[bin]] portal-native` for local dev without a
         browser, and trunk refuses to guess between the two. -->
    <link data-trunk rel="rust" data-target-name="portal_frontend" />
    <base data-trunk-public-url />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas#the_canvas_id {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
